services:
  db:
    image: postgres:15
    container_name: arxiver-db
    environment:
      POSTGRES_USER: arxiver
      POSTGRES_PASSWORD: arxiver
      POSTGRES_DB: arxiver
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    shm_size: '256mb'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arxiver"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arxiver
    ports:
      - "7854:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cron:
    # Same image and code as the app, but serves no traffic: the harvest runs
    # here, in its own process. It used to run as a thread inside a gunicorn
    # worker, where a long catch-up starved request handling and the site
    # served white pages.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arxiver-cron
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      # Daily harvest time, UTC.
      - HARVEST_AT=08:15
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "/app/ops/harvest-loop.sh"]
    restart: unless-stopped

volumes:
  pgdata:
