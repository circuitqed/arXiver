services:
  db:
    image: postgres:15
    container_name: arxiver-db
    environment:
      POSTGRES_USER: arxiver
      POSTGRES_PASSWORD: arxiver
      POSTGRES_DB: arxiver
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    restart: unless-stopped
    shm_size: '256mb'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arxiver"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: arxiver
    ports:
      - "7854:5000"
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - FLASK_DEBUG=0
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  cron:
    image: alpine:latest
    container_name: arxiver-cron
    depends_on:
      - app
    env_file:
      - .env
    command:
      - sh
      - -c
      - |
        echo "15 8 * * * wget -qO- --timeout=3600 \"http://app:5000/update?token=$$UPDATE_TOKEN\"" > /etc/crontabs/root
        crond -f -l 8
    restart: unless-stopped

volumes:
  pgdata:
